# Base de datos

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT

jwt.secret=${JWT_SECRET}

# Logging

logging.level.com.example.backend=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# Email (Brevo)

brevo.api-key=${BREVO_API_KEY}
brevo.from.email=ederlg2021@gmail.com
brevo.from.name=ZunoChat
email.enabled=true

# Feature flags
redis.enabled=${REDIS_ENABLED:false}
rabbitmq.enabled=${RABBITMQ_ENABLED:false}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# RabbitMQ

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:rabbit}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbit123}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:zunochat}
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.prefetch=5
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# WebSocket

websocket.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200
# Auto-configure exclusions cuando los servicios están deshabilitados
# Spring Boot intenta conectar Redis/Rabbit en startup aunque no haya beans propios.
# Se desactiva su autoconfigure aquí y se proveen beans condicionales en config.

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration