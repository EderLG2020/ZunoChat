# Base de datos

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT

jwt.secret=${JWT_SECRET}

# Logging

logging.level.com.example.backend=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# Email (Resend)
#
# Sin dominio propio verificado en Resend, el remitente tiene que ser
# onboarding@resend.dev (el de pruebas de Resend) — y con eso, solo se puede
# enviar a la casilla con la que te registraste en Resend. Cuando se verifique
# un dominio propio, cambiar resend.from.email a uno de ese dominio.

resend.api-key=${RESEND_API_KEY}
resend.from.email=onboarding@resend.dev
resend.from.name=ZunoChat
email.enabled=true

# WebSocket
#
# En dev se permite "*" porque la app móvil (Expo Go / dev client) conecta
# desde la IP LAN del teléfono o del emulador (10.0.2.2, 192.168.x.x, etc.),
# que no se puede enumerar de antemano. En producción reemplazar por el/los
# dominio(s) reales — nunca dejar "*" en prod.

websocket.allowed-origins=*

# CORS (REST) — a diferencia del WS, Spring no permite "*" junto con
# allowCredentials(true) (CorsConfig), así que acá sí hace falta una lista
# explícita: los puertos de `npm run dev` / `expo start --web`.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200,http://localhost:8081,http://localhost:19006}