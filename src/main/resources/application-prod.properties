# ??? Base de datos ?????????????????????????????????????????????????????????????
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
server.port=8080

# ??? JWT ???????????????????????????????????????????????????????????????????????
jwt.secret=${JWT_SECRET}

# ??? Logging ???????????????????????????????????????????????????????????????????
logging.level.com.example.backend=INFO

# ??? Email (Brevo) ?????????????????????????????????????????????????????????????
brevo.api-key=${BREVO_API_KEY}
brevo.from.email=ederlg2021@gmail.com
brevo.from.name=ZunoChat
email.enabled=true

# ??? Feature flags ?????????????????????????????????????????????????????????????
redis.enabled=${REDIS_ENABLED:false}
rabbitmq.enabled=${RABBITMQ_ENABLED:false}

# ??? Redis ?????????????????????????????????????????????????????????????????????
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# ??? RabbitMQ ??????????????????????????????????????????????????????????????????
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:rabbit}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbit123}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:zunochat}

# ??? WebSocket ?????????????????????????????????????????????????????????????????
websocket.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# ??? Deshabilitar autoconfigure ????????????????????????????????????????????????
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration