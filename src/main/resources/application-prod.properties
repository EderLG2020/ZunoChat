# ??? Base de datos ?????????????????????????????????????????????????????????????
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
server.port=8080

# ??? JWT ???????????????????????????????????????????????????????????????????????
jwt.secret=${JWT_SECRET}

# ??? Logging ???????????????????????????????????????????????????????????????????
logging.level.com.example.backend=INFO

# ??? Email (Resend) ????????????????????????????????????????????????????????????
# Sin dominio propio verificado en Resend, el remitente debe ser
# onboarding@resend.dev — cambiar a un dominio propio antes de un uso real en
# producción (con onboarding@resend.dev solo se envía a la casilla registrada
# en Resend).
resend.api-key=${RESEND_API_KEY}
resend.from.email=onboarding@resend.dev
resend.from.name=ZunoChat
email.enabled=true

# ??? WebSocket ?????????????????????????????????????????????????????????????????
websocket.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# ??? CORS (REST) ????????????????????????????????????????????????????????????????
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}