spring.application.name=backend

spring.profiles.active=dev

# ─── Migraciones (Flyway) ────────────────────────────────────────────────
#
# baseline-on-migrate=true: la primera vez que Flyway corre contra una BD que
# ya tiene tablas (creadas hasta ahora por Hibernate ddl-auto=update en dev,
# o a mano en prod), no intenta recrearlas — marca baseline-version como "ya
# aplicado" y solo corre las migraciones posteriores a esa versión. Con
# baseline-version=0 (default), CUALQUIER migración en db/migration (V1, V2...)
# se considera posterior al baseline y se aplica. Ver 06-database/migrations.md.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ─── Pool de conexiones / threads (antes en default implícito) ─────────────
#
# Hikari sin configurar usa 10 conexiones por defecto — compartidas entre
# REST y JPA, se agotan rápido bajo concurrencia real. 20 es un punto de
# partida razonable para una instancia; en multi-instancia, revisar que
# (maximum-pool-size × N instancias) no supere max_connections de Postgres.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}

# Mismo valor que el default de Tomcat (200) — se deja explícito para que
# quede visible y ajustable por entorno en vez de depender del default
# implícito del framework.
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:10}

# Access log de Tomcat — deshabilitado por defecto (no se activa solo). El
# handshake WS acepta el JWT por query param (?token=...) como respaldo para
# proxies que descartan headers (JwtHandshakeInterceptor); el patrón default
# de Tomcat (%r, "línea de request completa") dejaría ese token en el log de
# acceso si alguna vez se habilita. Se deja preconfigurado con %U (solo el
# path, sin query string) para que activarlo más adelante no filtre tokens
# por accidente.
server.tomcat.accesslog.enabled=${TOMCAT_ACCESSLOG_ENABLED:false}
server.tomcat.accesslog.pattern=%h %l %u %t "%m %U %H" %s %b

# ─── Escalabilidad horizontal (opcional, apagado por defecto) ──────────────
#
# app.presence.store=memory (default) → PresenceService y
#   WebSocketSessionRegistry en ConcurrentHashMap local a la instancia.
#   Funciona perfecto con un solo nodo (el caso de hoy).
# app.presence.store=redis → misma lógica pero respaldada en Redis, así
#   "¿está online?" y "¿tiene sesión activa?" son correctos aunque el
#   usuario esté conectado a otra instancia del backend. Requiere Redis
#   corriendo (ver docker-compose.yml → servicio "redis").
app.presence.store=${PRESENCE_STORE:memory}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# app.websocket.relay.enabled=false (default) → broker STOMP simple en
#   memoria de Spring (registry.enableSimpleBroker). Con más de una
#   instancia del backend, un mensaje solo llega a los clientes conectados
#   a esa misma instancia.
# app.websocket.relay.enabled=true → delega el broker a RabbitMQ (plugin
#   STOMP) para que todas las instancias compartan el mismo fan-out.
#   Requiere RabbitMQ corriendo con el plugin STOMP (ver docker-compose.yml
#   → servicio "rabbitmq").
app.websocket.relay.enabled=${WS_RELAY_ENABLED:false}
app.websocket.relay.host=${WS_RELAY_HOST:localhost}
app.websocket.relay.port=${WS_RELAY_PORT:61613}
app.websocket.relay.login=${WS_RELAY_LOGIN:rabbit}
app.websocket.relay.passcode=${WS_RELAY_PASSCODE:rabbit123}

# ─── Subida de archivos ──────────────────────────────────────────────────
#
# app.storage.provider=local (default) → guarda en disco (app.storage.local.dir)
#   y los sirve en /uploads/**. No requiere ninguna cuenta externa — funciona
#   igual en dev que en un despliegue de un solo nodo. Límite real: con más de
#   una instancia, o en un host con almacenamiento efímero (la mayoría de PaaS),
#   los archivos no se comparten entre instancias ni sobreviven un redeploy.
# app.storage.provider=cloudinary → sube a Cloudinary (persiste y se comparte
#   entre instancias). Requiere CLOUDINARY_CLOUD_NAME/API_KEY/API_SECRET.
app.storage.provider=${STORAGE_PROVIDER:local}

app.storage.local.dir=${STORAGE_LOCAL_DIR:uploads}
# Debe ser una URL alcanzable por el DISPOSITIVO/navegador del cliente, igual
# que EXPO_PUBLIC_API_URL en el móvil — no necesariamente "localhost".
app.storage.local.base-url=${STORAGE_LOCAL_BASE_URL:http://localhost:8080}

app.storage.max-file-size-mb=${STORAGE_MAX_FILE_SIZE_MB:5}
app.storage.max-files-per-request=3

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ─── Login/registro con Google (authorization code flow) ───────────────────
#
# Client ID/Secret de un cliente OAuth tipo "Web application" en Google Cloud
# Console (APIs & Services → Credentials). El Client ID también lo necesita
# el frontend (VITE_GOOGLE_CLIENT_ID, mismo valor) — ese sí es público, pero
# el Client Secret NUNCA debe llegar al navegador, solo vive acá.
# Sin redirect URI real que configurar: el frontend usa ux_mode:'popup', que
# le pega al token endpoint de Google con redirect_uri=postmessage.
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB